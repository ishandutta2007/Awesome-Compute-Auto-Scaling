<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%"><defs><linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/></pattern><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="rgba(139, 92, 246, 0.35)"/><stop offset="100%" stop-color="rgba(139, 92, 246, 0.0)"/></linearGradient></defs><style>.title { font-family: system-ui, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }.subtitle { font-family: system-ui, sans-serif; font-weight: 500; font-size: 22px; fill: #9ca3af; }.badge-text { font-family: system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #60a5fa; }@keyframes pulse-glow { 0% { opacity: 0.4; } 50% { opacity: 0.8; } 100% { opacity: 0.4; } }@keyframes float-pill { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }.pulse-bg { animation: pulse-glow 6s infinite ease-in-out; }.floating-pill-1 { animation: float-pill 4s infinite ease-in-out; }.floating-pill-2 { animation: float-pill 5s infinite ease-in-out 1s; }</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="400" fill="url(#grid)" rx="16"/><circle cx="200" cy="100" r="150" fill="#3b82f6" opacity="0.15" filter="url(#glow)" class="pulse-bg"/><circle cx="1000" cy="300" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" class="pulse-bg"/><g opacity="0.4"><path d="M 0 320 Q 150 340 300 280 T 600 220 T 900 160 T 1200 120 L 1200 400 L 0 400 Z" fill="url(#area-grad)"/><path d="M 0 320 Q 150 340 300 280 T 600 220 T 900 160 T 1200 120" fill="none" stroke="url(#line-grad)" stroke-width="4" filter="url(#glow)"/></g><g transform="translate(80, 0)"><g transform="translate(0, 85)"><rect x="0" y="0" width="250" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/><text x="16" y="21" class="badge-text">⚡ AWESOME ARCHITECTURE</text></g><text x="0" y="175" class="title">Awesome Compute Auto Scaling</text><text x="0" y="225" class="subtitle">Curated directory of cloud autoscaling platforms &amp; open-source engines</text></g></svg>